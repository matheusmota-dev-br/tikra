[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/python", "crates/wasm"]
# python and wasm need maturin and wasm-bindgen to build a package; they stay out of the default `cargo build`
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "1.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/matheusmota-dev-br/tikra"
homepage = "https://github.com/matheusmota-dev-br/tikra"

[workspace.dependencies]
# the core's published name lives only here and in crates/core/Cargo.toml
tikra = { path = "crates/core", version = "1.4.0" }
# math labels are typeset by mathra; to work against a local checkout, see "Development" in the README
mathra = { version = "1.5.0", features = ["latin-modern"] }
