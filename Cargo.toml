[workspace]
resolver = "2"
members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# the core's published name lives only here and in crates/core/Cargo.toml
tikra = { path = "crates/core", version = "0.1.0" }
# math labels drawn by mathra (sibling repository, local)
mathra = { path = "../mathra/crates/core" }
