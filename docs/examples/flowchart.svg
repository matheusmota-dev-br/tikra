<svg xmlns="http://www.w3.org/2000/svg" xmlns:tikra="urn:tikra:1" viewBox="-1.993 -214.081 220.946 216.074" width="220.946pt" height="216.074pt" role="img" aria-labelledby="tr-title-048cc81a" aria-describedby="tr-desc-048cc81a"><rect x="-1.993" y="-214.081" width="220.946" height="216.074" fill="#ffffff"/><title id="tr-title-048cc81a">Diagram with 5 nodes and 5 connections</title><desc id="tr-desc-048cc81a">Diagram with 5 nodes and 5 connections. Nodes: Start; Read a number n; n is greater than 0?; Print “no”; Print “yes”. Connections: from Start to Read a number n; from Read a number n to n is greater than 0?; from n is greater than 0? to Print “no”, labeled “no”; from n is greater than 0? to Print “yes”, labeled “yes”; from Print “no” to Read a number n.</desc><metadata><tikra:source type="tikz">% Made up for the tikra benchmark.
\begin{tikzpicture}[node distance=1.2cm,
    box/.style={rectangle, draw, rounded corners, minimum width=3cm, minimum height=0.9cm, align=center, fill=blue!8},
    choice/.style={diamond, draw, aspect=2, fill=orange!15},
    line/.style={-Stealth, thick}]
  \node[box] (start) {Start};
  \node[box, below=of start] (read) {Read a number $n$};
  \node[choice, below=of read] (test) {$n &gt; 0$?};
  \node[box, right=2cm of test] (neg) {Print ``no''};
  \node[box, below=of test] (pos) {Print ``yes''};
  \draw[line] (start) -- (read);
  \draw[line] (read) -- (test);
  \draw[line] (test) -- node[above] {no} (neg);
  \draw[line] (test) -- node[right] {yes} (pos);
  \draw[line] (neg) |- (read);
\end{tikzpicture}
