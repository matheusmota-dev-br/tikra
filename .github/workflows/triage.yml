# Labels and assigns issues and pull requests from their title; the rules are in .github/scripts/triage.js.
name: triage

on:
  issues:
    types: [opened, reopened, edited]
  # pull_request_target runs with the base branch's workflow and a write token, so it also works
  # for forks; only the base branch's .github/scripts is checked out, never the pull request's code.
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v7
        with:
          script: |
            const { triage } = require('./.github/scripts/triage.js');
            await triage({ github, context, core });
