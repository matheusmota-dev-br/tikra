# Every line of the Rust crates runs in the tests (docs/tests.md, "Coverage"): scripts/coverage.sh fails
# if any line runs in no test. Its own workflow so the README's badge shows this check alone.
name: coverage

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - run: scripts/coverage.sh
