[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "tikra"
description = "TikZ and pgfplots figures to SVG and PNG, without a TeX install. Math labels typeset by mathra."
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
license = "(MIT OR Apache-2.0) AND OFL-1.1 AND LicenseRef-GUST-Font-License"
# copies of the repository root files and of mathra's font licenses: the OFL (STIX Two Math) and the
# GUST Font License (Latin Modern Math and TeX Gyre Termes, which SPDX does not list) require their text next to the fonts
license-files = ["licenses/*"]
authors = [{ name = "Matheus Mota" }]
keywords = ["tikz", "pgfplots", "latex", "svg", "png", "figures", "diagrams", "plots", "rust", "python", "cli", "javascript", "webassembly"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://matheusmota-dev-br.github.io/tikra/"
Repository = "https://github.com/matheusmota-dev-br/tikra"
Issues = "https://github.com/matheusmota-dev-br/tikra/issues"
Documentation = "https://github.com/matheusmota-dev-br/tikra#install-and-use"

[tool.maturin]
python-source = "python"
module-name = "tikra._tikra"
features = ["pyo3/extension-module"]
