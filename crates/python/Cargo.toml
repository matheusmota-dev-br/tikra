[package]
name = "tikra-python"
# the Python package has its own version, published by py-v* tags (.github/workflows/pypi.yml)
version = "1.6.0"
description = "Python bindings of tikra: TikZ figures to SVG and PNG"
edition.workspace = true
license.workspace = true
publish = false

[lib]
# the module name imported in Python (`import tikra`) comes from pyproject.toml
name = "tikra_python"
crate-type = ["cdylib"]

[dependencies]
tikra.workspace = true
pyo3 = { version = "0.25", features = ["extension-module", "abi3-py39"] }
